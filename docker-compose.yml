# The json-file driver never rotates on its own, and these containers run for
# weeks. On a 7GB root volume that is enough to fill the disk on logs alone, so
# every service gets a ceiling rather than just the chatty one.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    # Both keys on purpose. The deploy sets API_IMAGE to the tag CI built and
    # never passes --build, so the host only ever pulls; `docker compose up
    # --build` locally still builds from the Dockerfile and tags the result.
    # The default keeps a bare `docker compose up -d` on the server working,
    # though it takes whatever :latest is rather than matching the checkout.
    image: ${API_IMAGE:-ghcr.io/volodymyrbiletskyi/smart-pet-care-api:latest}
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Set here rather than in appsettings.json, which .dockerignore keeps out
      # of the image -- the container has no settings file, so an unset category
      # falls back to Information and EF logs every statement it runs. Override
      # to Information in .env when you need to see the SQL.
      - Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command=${EF_COMMAND_LOG_LEVEL:-Warning}
      - ApiPublicUrl=${API_PUBLIC_URL:-http://localhost:8080}
      - ConnectionStrings__DbConnection=Host=db;Port=5432;Database=smartPetCareDb;Username=postgres;Password=${DB_PASSWORD}
      - JwtOptions__SecretKey=${JWT_SECRET}
      - JwtOptions__Issuer=${JWT_ISSUER}
      - JwtOptions__Audience=${JWT_AUDIENCE}
      - GoogleOAuth__ClientId=${GOOGLE_CLIENT_ID}
      - GoogleOAuth__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - GoogleOAuth__RedirectUri=${GOOGLE_REDIRECT_URI}
      - GoogleOAuth__AllowedAudiences__0=${GOOGLE_CLIENT_ID}
      - GoogleOAuth__AllowedAudiences__1=${GOOGLE_ANDROID_CLIENT_ID}
      - CLOUDINARY_NAME=${CLOUDINARY_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - Firebase__ProjectId=${FIREBASE_PROJECT_ID}
      - Firebase__ServiceAccountJson=/app/secrets/firebase-sa.json
      - Classifier__ApiKey=${CLASSIFIER_API_KEY}
      - Classifier__BaseUrl=${CLASSIFIER_BASE_URL}
      - Classifier__TimeoutSeconds=${CLASSIFIER_TIMEOUT_SECONDS:-30}
      - Email__Host=${EMAIL_HOST}
      - Email__Port=${EMAIL_PORT}
      - Email__Username=${EMAIL_USERNAME}
      - Email__Password=${EMAIL_PASSWORD}
      - Email__FromAddress=${EMAIL_FROM_ADDRESS}
      - Email__FromName=${EMAIL_FROM_NAME}
    volumes:
      - ./secrets/firebase-sa.json:/app/secrets/firebase-sa.json:ro
      # DataProtection writes its key ring here. Kept in a volume because a
      # container that comes up with a fresh one cannot read anything the
      # previous release protected -- antiforgery tokens and the correlation
      # cookie of anyone mid-way through a Google login, which a deploy would
      # otherwise break for every user in that state.
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      db:
        condition: service_healthy
    restart: always
    logging: *default-logging

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: smartPetCareDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # scripts/backup-db.sh and scripts/restore-db.sh work through this mount:
      # pg_restore has to read the dump from inside the container.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    logging: *default-logging


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api
    # nginx reads the certs once at startup, so reload periodically to pick up
    # whatever certbot has renewed in the background.
    command: >
      /bin/sh -c "while :; do
        sleep 6h & wait $${!};
        nginx -s reload;
      done & nginx -g 'daemon off;'"
    restart: always
    logging: *default-logging

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Try to renew twice a day; certbot only acts when a cert is within 30 days
    # of expiry, so the extra runs are cheap and give us plenty of retries.
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    restart: always
    logging: *default-logging

volumes:
  postgres_data:
  dataprotection_keys:
