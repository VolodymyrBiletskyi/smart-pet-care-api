events {}

http {
    # nginx defaults to 1m, which is below what the app itself advertises: 5 MB for
    # a pet photo, 1 MB for an avatar. Everything in between got nginx's own HTML
    # 413 instead of pet_photo_too_large, so an ordinary phone JPEG failed with an
    # error the client cannot read a code from. Kept a megabyte above the largest
    # app limit so multipart overhead on a 5 MB file still arrives and the app
    # stays the one that decides -- raising a limit should mean editing the C#,
    # not the proxy.
    client_max_body_size 6m;

    # First layer in front of the anonymous auth endpoints. Each of them either
    # burns BCrypt CPU or sends mail, so an unthrottled caller is both a password
    # guessing oracle and a way to make the SMTP sender spray someone else's
    # inbox. The app has its own limiter keyed the same way; this one keeps the
    # flood off the worker threads entirely. Keyed on the real client address --
    # $remote_addr is nginx's own peer, which here is the actual client since
    # nothing sits in front of it.
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=auth_email:10m rate=4r/m;

    # nginx rejects with 503 by default, which a client would read as "the API is
    # down" rather than "slow down". The body is still nginx's own HTML page -- a
    # caller that hits this layer has already blown past the app's limiter, which
    # does answer with ApiErrorResponse -- but the status is at least the truth.
    limit_req_status 429;

    server {
        listen 80;
        server_name smart-pet-care.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name smart-pet-care.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/smart-pet-care.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/smart-pet-care.duckdns.org/privkey.pem;

        location /scalar/ {
            auth_basic "Restricted API Docs";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /openapi/ {
            auth_basic "Restricted API Docs";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Exact-match locations so these take precedence over `location /` without
        # depending on declaration order. A burst is allowed because a user who
        # fat-fingers a password twice is not an attacker; nodelay so the ones
        # inside the burst are served immediately rather than queued.
        location = /api/auth/login {
            limit_req zone=auth_login burst=5 nodelay;

            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/auth/confirm-email {
            limit_req zone=auth_login burst=5 nodelay;

            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Tighter: these two send an email, so the cost of a request lands on
        # someone else's inbox and on the sending domain's reputation.
        location = /api/auth/register {
            limit_req zone=auth_email burst=2 nodelay;

            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/auth/resend-confirmation {
            limit_req zone=auth_email burst=2 nodelay;

            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Also an email, and the endpoint answers the same way for an address with
        # an account and one without -- so the cap is the only thing standing
        # between a list of addresses and a mailing.
        location = /api/auth/forgot-password {
            limit_req zone=auth_email burst=2 nodelay;

            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # The credentials zone: spending a reset link burns an enhanced BCrypt hash
        # here, same as a login attempt. The GET at /reset-password is only a page
        # and goes through `location /`.
        location = /api/auth/reset-password {
            limit_req zone=auth_login burst=5 nodelay;

            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
