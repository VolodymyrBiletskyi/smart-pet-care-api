<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f3f7f4">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Reset your Miso password</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: none; }
  body {
    margin: 0;
    padding: calc(8vh + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
             calc(32px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    background: #f3f7f4;
    color: #18211c;
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  main {
    max-width: 24rem;
    margin: 0 auto;
    padding: 30px 26px 28px;
    background: #ffffff;
    border: 1px solid #e3ebe5;
    border-radius: 16px;
  }
  .brand {
    margin: 0 0 24px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: #16854a;
  }
  h1 { margin: 0 0 10px; font-size: 19px; line-height: 1.3; font-weight: 600; }
  p { margin: 0 0 18px; font-size: 15px; color: #3f4a44; }
  p.hint { margin: 0; font-size: 13px; color: #78857d; }
  a.open {
    display: block;
    margin: 0 0 18px;
    padding: 14px 20px;
    background: #16854a;
    border-radius: 10px;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
  }
  @media (max-width: 380px) {
    body { font-size: 16.5px; padding-left: calc(14px + env(safe-area-inset-left)); padding-right: calc(14px + env(safe-area-inset-right)); }
    main { padding: 26px 20px 24px; }
  }
</style>
</head>
<body>

<main>
  <p class="brand">Miso</p>
  <h1>Reset your password</h1>
  <p>Open the app to choose a new one.</p>

  <!--
    The link lives in the href and nowhere else, so the token is escaped once, as
    HTML, and the script below reads it back off the element instead of being
    handed a second copy in a JavaScript string literal.
  -->
  <a class="open" id="open" href="{{appLink}}">Open the Miso app</a>

  <p class="hint">Nothing happened? Install Miso on this device, then open this link again from the same email.</p>
</main>

<script>
  // The button works without this; the script is only what saves the tap. A
  // small delay rather than an immediate replace, so the page has painted and
  // the user has something to read if no app answers the scheme.
  var link = document.getElementById('open');
  if (link) {
    setTimeout(function () { window.location.replace(link.href); }, 250);
  }
</script>

</body>
</html>
