<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f3f7f4">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>This reset link has expired</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: none; }
  body {
    margin: 0;
    padding: calc(8vh + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
             calc(32px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    background: #f3f7f4;
    color: #18211c;
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  main {
    max-width: 24rem;
    margin: 0 auto;
    padding: 30px 26px 28px;
    background: #ffffff;
    border: 1px solid #e3ebe5;
    border-radius: 16px;
  }
  .brand {
    margin: 0 0 24px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: #16854a;
  }
  h1 { margin: 0 0 10px; font-size: 19px; line-height: 1.3; font-weight: 600; }
  p { margin: 0 0 14px; font-size: 15px; color: #3f4a44; }
  p.hint { margin: 0; font-size: 13px; color: #78857d; }
  @media (max-width: 380px) {
    body { font-size: 16.5px; padding-left: calc(14px + env(safe-area-inset-left)); padding-right: calc(14px + env(safe-area-inset-right)); }
    main { padding: 26px 20px 24px; }
  }
</style>
</head>
<body>

<main>
  <p class="brand">Miso</p>
  <h1>This link no longer works</h1>
  <p>A reset link is valid for a short while and can be used once &mdash; this one has expired, or a newer one has replaced it.</p>
  <p class="hint">Open Miso, tap <strong>Forgot password</strong> and we will send a fresh link. Your password has not changed.</p>
</main>

</body>
</html>
